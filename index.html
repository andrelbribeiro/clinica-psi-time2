<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Gestão educacional de clínica de psicologia"><title>Clínica Psi</title><link rel="stylesheet" href="style.css"></head><body>
